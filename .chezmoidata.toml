# Host group definitions for conditional template logic.
# To add a machine to a group, append its hostname to the array.
# Usage in templates: {{- if has .chezmoi.hostname .host_groups.niri }}

[host_groups]
  niri = ["mondo"]
  kde  = []
  dev_infra = ["mondo"]
  # kinto (work Mac mini) died with the Focused job on 2026-09-02. latios is the
  # work machine now and hosts Tilly (was Florence). See logs/ark.md 2026-09-03.
  work = ["latios"]
  always_on = ["latios"]
  chaching = ["latios", "nimbus"]
  # Machines that run long-lived coding-agent runtimes (Orca serve, etc.)
  agentic = ["latios", "nimbus"]
  # Machines running the tokenmaxx multi-account proxy daemon. The daemon reads
  # account credentials from the macOS login Keychain, so it MUST run as a
  # GUI-session LaunchAgent (Aqua). A LaunchDaemon (system session) or an
  # SSH-spawned daemon fails every read with "Keychain read failed".
  # See ~/notes/2026-08-06 tokenmaxx daemon keychain + LaunchAgent.md
  tokenmaxx = ["nimbus", "latios"]
  # Machines that should get OPENROUTER_API_KEY written into ~/.env.
  # Empty = off everywhere (the default). See [feature_flags].openrouter_api_key.
  openrouter = []

[feature_flags]
  shared_claude_oauth = false
  # Write OPENROUTER_API_KEY into ~/.env. Default OFF: agent CLIs that dotenv-load
  # ~/.env (oh-my-pi/`omp`, aider, others) auto-select OpenRouter the moment they
  # see the key, which hijacks provider/model selection. Flip to true for a
  # fleet-wide opt-in, or add a single hostname to host_groups.openrouter.
  openrouter_api_key = false

[agents]
  # Main-session model for the Ark agents (Tilly on latios, Navi on nimbus).
  # Toggle with `agent-model fable|opus|show` (bin/executable_agent-model), which
  # edits this value, applies, and pushes. Takes effect on the NEXT ark session
  # start / `ark restart`; running sessions keep their model.
  #   fable -> "claude-fable-5-1"  (verified live 2026-09-02)
  #   opus  -> "claude-opus-5[1m]"  (1M-context Opus 5; verified live 2026-08-11)
  main_model = "claude-fable-5-1"
