# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# NaviDE: override upstream US layout with GB
input {
    kb_layout = gb
    sensitivity = -0.25 # range -1.0 to 1.0, 0 = default
    accel_profile = flat # disable pointer acceleration
}

# NaviDE: disable hardware cursors — required for flipped monitor (DP-2)
# to avoid a bugged cursor canvas
cursor {
    no_hardware_cursors = true
}

# Default layout: master (dwindle available via Hyper+Tab toggle)
# layout is global — no per-monitor support. C (media) uses master too but it's
# effectively fullscreen there so orientation is irrelevant in practice.
general {
    layout = master
}

master {
    # 0.5: master always takes exactly half the screen — consistent whether
    # there are 2 windows (50/50 split) or 3 (50% center, 25% each side)
    mfact = 0.5

    # Only center the master once there are 2 slaves (i.e. 3 windows total).
    # With 1 slave, falls back to a clean left/right split instead.
    slave_count_for_center_master = 2
    center_master_fallback = left

    # New windows open as slaves — don't displace the current master
    new_status = slave
}

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`
