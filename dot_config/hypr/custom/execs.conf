# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Input method
# exec-once = fcitx5

# Dark theme — ensure portal advertises dark preference to all apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark"

# KDE Wallet — needed by Vivaldi and other KDE/Qt apps for keystore
exec-once = kwalletd6

# 1Password — start minimized to tray
exec-once = 1password --ozone-platform-hint=wayland --silent


