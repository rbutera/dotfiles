# Keyboard-no-Jutsu: Hyprland keybinds override for end-4/dots-hyprland
# Reference: ~/dev/expedition/projects/29-navide/keyboard-proposal.md (v3)

# ============================================================
# UNBIND conflicting end-4 defaults
# ============================================================
unbind = Super, D
unbind = Super, F
unbind = Super, K
unbind = Super, J
unbind = Super, T
unbind = Super, E
unbind = Super, C
unbind = Super, S
unbind = Super, Tab
unbind = Super, Slash
unbind = Super, V
unbind = Super, Period
unbind = Super, A
unbind = Super, N
unbind = Super, G
unbind = Super, Q
unbind = Super, Return
unbind = Super, grave
unbind = Super, B
unbind = Super, H
unbind = Super, J
unbind = Super, Semicolon
unbind = Super, L
unbind = Super, Equal
unbind = Super, Minus
unbind = Ctrl+Super, T
unbind = Ctrl+Super+Alt, T

# ============================================================
# CHEATSHEET COLUMN 1: Apps & Windows
# ============================================================

#! Apps & Windows

##! Apps
bind = Super, grave, exec, $TERMINAL || ghostty || kitty -1 || foot  # Terminal
bind = Super, Return, exec, $TERMINAL || ghostty || kitty -1 || foot # [hidden]
bind = Super, B, exec, vivaldi-stable || zen-browser || firefox      # Browser
bind = Super, C, exec, code || codium || cursor || zed               # Code editor
bind = Control+Alt+Super, D, exec, vesktop || discord                # Discord
bind = Control+Alt+Super, E, exec, dolphin || nautilus || thunar     # File manager
bind = Super, K, exec, morgen || gnome-calendar || korganizer        # Calendar
bind = Control+Alt+Super, S, togglespecialworkspace,                 # Scratchpad
bind = Control+Alt+Super+Shift, S, movetoworkspacesilent, special   # Send to scratchpad

##! Windows
bind = Super, Q, killactive,                            # Close window
bind = Super+Shift, Q, exec, hyprctl kill               # Force kill (click)
bind = Super, T, togglefloating,                        # Float / unfloat
bind = Control+Alt+Super, T, fullscreen, 0              # Fullscreen
bind = Control+Alt+Super, V, fullscreen, 1              # Maximize
bind = Control+Alt+Super, C, layoutmsg, swapnext        # Swap next
bind = Control+Alt+Super, A, layoutmsg, cyclenext       # Cycle layout
binde = Super, H, layoutmsg, splitratio -0.1            # Shrink split
binde = Super, L, layoutmsg, splitratio +0.1            # Grow split
binde = Super, J, resizeactive, 0 40                    # Resize taller
binde = Super, K, resizeactive, 0 -40                   # Resize shorter

##! Focus & Move (Super + ESDF)
bind = Super, E, movefocus, u                           # Focus up
bind = Super, S, movefocus, l                           # Focus left
bind = Super, D, movefocus, d                           # Focus down
bind = Super, F, movefocus, r                           # Focus right
bind = Super+Shift, E, movewindow, u                    # Move up
bind = Super+Shift, S, movewindow, l                    # Move left
bind = Super+Shift, D, movewindow, d                    # Move down
bind = Super+Shift, F, movewindow, r                    # Move right

##! Mouse
bindm = Super, mouse:272, movewindow                    # Drag = move
bindm = Super, mouse:273, resizewindow                  # Drag = resize
bind = Super, mouse_up, workspace, +1                   # Scroll = next WS
bind = Super, mouse_down, workspace, -1                 # [hidden]

# ============================================================
# CHEATSHEET COLUMN 2: Navigation
# ============================================================

#! Navigation

##! Workspaces
bind = Super, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 1  # Go to 1
bind = Super, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 2  # Go to 2
bind = Super, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 3  # Go to 3
bind = Super, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 4  # Go to 4
bind = Super, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 5  # Go to 5
bind = Super, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 6  # Go to 6
bind = Super+Shift, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1  # Send to 1
bind = Super+Shift, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2  # [hidden]
bind = Super+Shift, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3  # [hidden]
bind = Super+Shift, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4  # [hidden]
bind = Super+Shift, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5  # [hidden]
bind = Super+Shift, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6  # [hidden]
# Hyper layer mirrors (hidden from cheatsheet)
bind = Control+Alt+Super, code:10, workspace, 1         # [hidden]
bind = Control+Alt+Super, code:11, workspace, 2         # [hidden]
bind = Control+Alt+Super, code:12, workspace, 3         # [hidden]
bind = Control+Alt+Super, code:13, workspace, 4         # [hidden]
bind = Control+Alt+Super, code:14, workspace, 5         # [hidden]
bind = Control+Alt+Super, code:15, workspace, 6         # [hidden]
bind = Control+Alt+Super+Shift, code:10, movetoworkspacesilent, 1  # [hidden]
bind = Control+Alt+Super+Shift, code:11, movetoworkspacesilent, 2  # [hidden]
bind = Control+Alt+Super+Shift, code:12, movetoworkspacesilent, 3  # [hidden]
bind = Control+Alt+Super+Shift, code:13, movetoworkspacesilent, 4  # [hidden]
bind = Control+Alt+Super+Shift, code:14, movetoworkspacesilent, 5  # [hidden]
bind = Control+Alt+Super+Shift, code:15, movetoworkspacesilent, 6  # [hidden]

##! Focus & Move (Hyper + ESDF) [hidden mirrors]
bind = Control+Alt+Super, E, movefocus, u              # [hidden]
bind = Control+Alt+Super, S, movefocus, l              # [hidden]
bind = Control+Alt+Super, D, movefocus, d              # [hidden]
bind = Control+Alt+Super, F, movefocus, r              # [hidden]
bind = Control+Alt+Super+Shift, E, movewindow, u       # [hidden]
bind = Control+Alt+Super+Shift, S, movewindow, l       # [hidden]
bind = Control+Alt+Super+Shift, D, movewindow, d       # [hidden]
bind = Control+Alt+Super+Shift, F, movewindow, r       # [hidden]

##! Monitors (Hyper + QWR)
bind = Control+Alt+Super, Q, focusmonitor, 0            # Focus B (left)
bind = Control+Alt+Super, W, focusmonitor, 1            # Focus A (main)
bind = Control+Alt+Super, R, focusmonitor, 2            # Focus C (top)
bind = Control+Alt+Super+Shift, Q, movewindow, mon:0    # Send to B
bind = Control+Alt+Super+Shift, W, movewindow, mon:1    # Send to A
bind = Control+Alt+Super+Shift, R, movewindow, mon:2    # Send to C

##! Resize (Hyper)
binde = Control+Alt+Super, Semicolon, layoutmsg, splitratio -0.1  # Shrink
binde = Control+Alt+Super, Apostrophe, layoutmsg, splitratio +0.1 # Grow

# ============================================================
# CHEATSHEET COLUMN 3: System & UI
# ============================================================

#! System & UI

##! Shell
bind = Super, Tab, global, quickshell:overviewWorkspacesToggle  # Overview
bind = Control+Alt+Super, Tab, global, quickshell:overviewWorkspacesToggle  # [hidden]
bind = Super, Slash, global, quickshell:cheatsheetToggle  # Cheatsheet
bind = Super, V, global, quickshell:overviewClipboardToggle  # Clipboard
bind = Super, Period, global, quickshell:overviewEmojiToggle # Emoji
bind = Super, A, global, quickshell:sidebarLeftToggle    # Left sidebar
bind = Super, N, global, quickshell:sidebarRightToggle   # Right sidebar
bind = Super, Semicolon, global, quickshell:sidebarRightToggle  # Right sidebar (alt)
bind = Control+Alt+Super, grave, global, quickshell:sidebarLeftToggle   # [hidden]
bind = Control+Alt+Super, G, global, quickshell:sidebarRightToggle     # [hidden]
bind = Super, G, global, quickshell:overlayToggle        # Overlay
bind = Super, Equal, exec, ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.3  # Zoom in
bind = Super, Minus, exec, ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.3  # Zoom out
bind = Ctrl+Super, R, exec, killall qs quickshell; qs -c $qsConfig &  # Restart widgets

##! Capture
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy    # Screenshot
bind = Shift, Print, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh  # Record
bind = Control+Alt+Super, X, exec, grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy  # OCR
bind = Control+Alt+Super+Shift, X, exec, grim -g "$(slurp)" /tmp/lens.png && xdg-open "https://lens.google.com/uploadbyurl?url=file:///tmp/lens.png"  # Google Lens
bind = Control+Alt+Super, Z, exec, hyprpicker -a         # Color picker

##! 1Password
bind = Ctrl+Alt, P, exec, 1password --ozone-platform-hint=wayland --quick-access  # Quick access
bind = Ctrl+Alt+Shift, P, exec, 1password --toggle        # Show / hide

##! System
bind = Super+Shift, L, exec, systemctl suspend           # Suspend
bindd = Ctrl+Alt, Delete, Toggle session menu, global, quickshell:sessionToggle  # Session menu
bind = Control+Alt+Super, M, exec, wpctl set-mute @DEFAULT_SINK@ toggle     # Mute output
bind = Control+Alt+Super+Shift, M, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle  # Mute mic

##! Media
bindl = Super+Shift, P, exec, playerctl play-pause       # Play / pause
bindl = Super+Shift, N, exec, playerctl next             # Next track
bindl = Super+Shift, B, exec, playerctl previous         # Previous track

# Hardware keys (hidden — pass through from keyboard)
bindle=, XF86MonBrightnessUp, exec, brightnessctl s 5%+  # [hidden]
bindle=, XF86MonBrightnessDown, exec, brightnessctl s 5%-  # [hidden]
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5  # [hidden]
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-  # [hidden]
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle  # [hidden]
bindl=, XF86AudioPlay, exec, playerctl play-pause  # [hidden]
bindl=, XF86AudioNext, exec, playerctl next  # [hidden]
bindl=, XF86AudioPrev, exec, playerctl previous  # [hidden]
