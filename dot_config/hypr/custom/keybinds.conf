# Keyboard-no-Jutsu: Hyprland keybinds override for end-4/dots-hyprland
# Reference: ~/dev/expedition/projects/29-navide/keyboard-proposal.md (v3)

# ============================================================
# UNBIND conflicting end-4 defaults
# ============================================================
unbind = Super, D
unbind = Super, F
unbind = Super, K
unbind = Super, J
unbind = Super, T
unbind = Super, E
unbind = Super, C
unbind = Super, S
unbind = Super, Tab
unbind = Super, Slash
unbind = Super, V
unbind = Super, Period
unbind = Super, A
unbind = Super, N
unbind = Super, G
unbind = Super, Q
unbind = Super, J
unbind = Super, K
unbind = Super, M
unbind = Super+Shift, M
unbind = Super+Alt, M
unbind = Super, Return
unbind = Super, grave
unbind = Super, B
unbind = Super, H
unbind = Super, Semicolon
unbind = Super, L
unbind = Super, Equal
unbind = Super, Minus
unbind = Ctrl+Super, T
unbind = Ctrl+Super+Alt, T

# Upstream Super+Alt bindings — we own Super+Alt for resize (ESDF)
unbind = Super+Alt, S
unbind = Super+Alt, F
unbind = Super+Alt, A
unbind = Super+Alt, M
unbind = Super+Alt, R
unbind = Super+Alt, Space

# Upstream Super+Shift bindings that conflict with our window move layer
unbind = Super+Shift, S

# Upstream media keys that duplicate our bindings — double-firing toggles cancel out
unbind = , XF86AudioPlay
unbind = , XF86AudioPause
unbind = , XF86AudioNext
unbind = , XF86AudioPrev

# ============================================================
# CHEATSHEET COLUMN 1: Apps & Windows
# ============================================================

#! Apps & Windows

##! Apps (Hyper layer — all focus/launch)
bind = Super, Return, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "com.mitchellh.ghostty" ghostty  # Terminal
bind = Control+Alt+Super, Return, exec, ghostty                                                                # Terminal (new instance)
bind = Control+Alt+Super, B, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "brave-browser" brave     # Browser
bind = Control+Alt+Super, C, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "[Cc]ode" code            # Code editor
bind = Control+Alt+Super, D, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "vesktop" vesktop         # Discord
bind = Control+Alt+Super, K, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "[Mm]orgen" morgen        # Calendar
bind = Control+Alt+Super, N, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "obsidian" obsidian       # Notes (Obsidian)
bind = Control+Alt+Super, O, exec, ~/.config/hypr/custom/scripts/focus-or-launch.sh "dolphin" dolphin         # File manager
bind = Control+Alt+Super, P, exec, 1password --ozone-platform-hint=wayland --quick-access                     # 1Password quick access
bind = Control+Alt+Super+Shift, P, exec, 1password --ozone-platform-hint=wayland --toggle                     # 1Password toggle

##! Scratchpad
bind = Super, grave, exec, ~/.config/hypr/custom/scripts/toggle-scratchpad.sh  # Toggle scratchpad (seeds terminal if empty)
bind = Shift, grave, movetoworkspacesilent, special                             # Send to scratchpad

##! Windows
bind = Super, Q, killactive,                            # Close window
bind = Super+Shift, Q, exec, hyprctl kill               # Force kill (click)
bind = Super, T, togglefloating,                        # Float / unfloat
bind = Control+Alt+Super, T, fullscreen, 0              # Fullscreen
bind = Control+Alt+Super, V, fullscreen, 1              # Maximize
binde = Super, H, layoutmsg, splitratio -0.1            # Shrink master split
binde = Super, L, layoutmsg, splitratio +0.1            # Grow master split
bind = Super, J, layoutmsg, cyclenext                   # Focus next window
bind = Super, K, layoutmsg, cycleprev                   # Focus prev window
bind = Super+Shift, J, layoutmsg, swapnext              # Swap with next
bind = Super+Shift, K, layoutmsg, swapprev              # Swap with prev
bind = Super, M, layoutmsg, swapwithmaster auto          # Toggle master: promote if slave, cycle if master
bind = Super+Shift, M, layoutmsg, focusmaster            # Focus master

##! Focus & Move (Super + ESDF)
bind = Super, E, movefocus, u                           # Focus up
bind = Super, S, movefocus, l                           # Focus left
bind = Super, D, movefocus, d                           # Focus down
bind = Super, F, movefocus, r                           # Focus right
bind = Super+Shift, E, movewindow, u                    # Move up
bind = Super+Shift, S, movewindow, l                    # Move left
bind = Super+Shift, D, movewindow, d                    # Move down
bind = Super+Shift, F, movewindow, r                    # Move right

##! Resize (Super+Alt + ESDF) — dwindle layout
binde = Super+Alt, E, resizeactive, 0 -40               # Resize up
binde = Super+Alt, D, resizeactive, 0 40                # Resize down
binde = Super+Alt, S, resizeactive, -40 0               # Resize left
binde = Super+Alt, F, resizeactive, 40 0                # Resize right

##! Mouse
bindm = Super, mouse:272, movewindow                    # Drag = move
bindm = Super, mouse:273, resizewindow                  # Drag = resize
bind = Super, mouse_up, workspace, +1                   # Scroll = next WS
bind = Super, mouse_down, workspace, -1                 # [hidden]

# ============================================================
# CHEATSHEET COLUMN 2: Navigation
# ============================================================

#! Navigation

##! Workspaces — relative to current monitor (see local-workspace.sh)
# On A (DP-1):     1→ws1  2→ws2  3→ws3  4→ws4
# On B (HDMI-A-2): 1→ws5  2→ws6  3→ws7  (4 ignored)
# On C (DP-2):     1→ws8  2→ws9  3→ws10 (4 ignored)
bind = Super, code:10, exec, ~/.config/hypr/custom/scripts/local-workspace.sh workspace 1       # Go to 1
bind = Super, code:11, exec, ~/.config/hypr/custom/scripts/local-workspace.sh workspace 2       # Go to 2
bind = Super, code:12, exec, ~/.config/hypr/custom/scripts/local-workspace.sh workspace 3       # Go to 3
bind = Super, code:13, exec, ~/.config/hypr/custom/scripts/local-workspace.sh workspace 4       # Go to 4
bind = Super+Shift, code:10, exec, ~/.config/hypr/custom/scripts/local-workspace.sh movetoworkspace 1  # Move to 1
bind = Super+Shift, code:11, exec, ~/.config/hypr/custom/scripts/local-workspace.sh movetoworkspace 2  # [hidden]
bind = Super+Shift, code:12, exec, ~/.config/hypr/custom/scripts/local-workspace.sh movetoworkspace 3  # [hidden]
bind = Super+Shift, code:13, exec, ~/.config/hypr/custom/scripts/local-workspace.sh movetoworkspace 4  # [hidden]

##! Monitors (Hyper + ESDF — spatial: E=above, S=left, F=right)
bind = Control+Alt+Super, E, focusmonitor, DP-2         # Focus C (above)
bind = Control+Alt+Super, S, focusmonitor, HDMI-A-2     # Focus B (left)
bind = Control+Alt+Super, F, focusmonitor, DP-1         # Focus A (main)
bind = Control+Alt+Super+Shift, E, movewindow, mon:DP-2      # Send to C
bind = Control+Alt+Super+Shift, S, movewindow, mon:HDMI-A-2  # Send to B
bind = Control+Alt+Super+Shift, F, movewindow, mon:DP-1      # Send to A


# ============================================================
# CHEATSHEET COLUMN 3: System & UI
# ============================================================

#! System & UI

##! Shell
bind = Super, Tab, global, quickshell:overviewWorkspacesToggle  # Overview
bind = Control+Alt+Super, Tab, exec, ~/.config/hypr/custom/scripts/toggle-layout.sh  # Toggle layout
bind = Super, Slash, global, quickshell:cheatsheetToggle  # Cheatsheet
bind = Super, V, global, quickshell:overviewClipboardToggle  # Clipboard
bind = Super, Period, global, quickshell:overviewEmojiToggle # Emoji
bind = Super, A, global, quickshell:sidebarLeftToggle    # Left sidebar
bind = Super, G, global, quickshell:sidebarRightToggle   # Right sidebar
bind = Control+Alt+Super, grave, global, quickshell:overlayToggle  # Overlay
bind = Super, Equal, exec, ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.3  # Zoom in
bind = Super, Minus, exec, ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.3  # Zoom out
bind = Ctrl+Super, R, exec, killall qs quickshell; qs -c $qsConfig &  # Restart widgets

##! Capture
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy    # Screenshot
bind = Shift, Print, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh  # Record
bind = Control+Alt+Super, X, exec, grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy  # OCR
bind = Control+Alt+Super+Shift, X, exec, grim -g "$(slurp)" /tmp/lens.png && xdg-open "https://lens.google.com/uploadbyurl?url=file:///tmp/lens.png"  # Google Lens
bind = Control+Alt+Super, Z, exec, hyprpicker -a         # Color picker

##! System
bindd = Ctrl+Alt, Delete, Toggle session menu, global, quickshell:sessionToggle  # Session menu
bind = Control+Alt+Super, M, exec, wpctl set-mute @DEFAULT_SINK@ toggle     # Mute output
bind = Control+Alt+Super+Shift, M, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle  # Mute mic

##! Media
bindl = Super+Shift, P, exec, playerctl play-pause       # Play / pause
bindl = Super+Shift, N, exec, playerctl next             # Next track
bindl = Super+Shift, B, exec, playerctl previous         # Previous track

# Hardware keys (hidden — pass through from keyboard)
bindle=, XF86MonBrightnessUp, exec, brightnessctl s 5%+  # [hidden]
bindle=, XF86MonBrightnessDown, exec, brightnessctl s 5%-  # [hidden]
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5  # [hidden]
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-  # [hidden]
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle  # [hidden]
bindl=, XF86AudioPlay, exec, playerctl play-pause  # [hidden]
bindl=, XF86AudioNext, exec, playerctl next  # [hidden]
bindl=, XF86AudioPrev, exec, playerctl previous  # [hidden]

# ============================================================
# PARSEC PASSTHROUGH SUBMAP
# Activated automatically by parsec-submap.sh when parsecd is focused.
# Empty submap = all keypresses pass through to the window uninterrupted.
# This lets Parsec receive Super (used as Ctrl on Mac clients) without
# Hyprland intercepting it.
# ============================================================
submap = parsec
bind = Ctrl+Alt, Escape, submap, reset  # manual escape hatch if daemon misbehaves
submap = reset
