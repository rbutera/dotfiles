# Keyboard-no-Jutsu: Hyprland keybinds override for end-4/dots-hyprland
# Source this AFTER the end-4 keybinds.conf, or replace it entirely.
# Reference: ~/dev/expedition/projects/29-navide/keyboard-proposal.md (v3)

# ============================================================
# UNBIND conflicting end-4 defaults
# ============================================================

# We're taking over these keys
unbind = Super, D          # was maximize, now discord
unbind = Super, F          # was fullscreen
unbind = Super, K          # was on-screen keyboard, now calendar
unbind = Super, J          # was toggle bar (we redefine)
unbind = Super, T          # was terminal, now float toggle
unbind = Super, E          # was file manager (we redefine)
unbind = Super, C          # was code editor (we redefine)
unbind = Super, S          # was scratchpad (we redefine)

# Unbind global dispatcher binds we redefine (duplicates break global dispatch)
unbind = Super, Tab        # overview
unbind = Super, Slash      # cheatsheet
unbind = Super, V          # clipboard
unbind = Super, Period     # emoji
unbind = Super, A          # left sidebar
unbind = Super, N          # right sidebar
unbind = Super, G          # overlay
unbind = Super, Q          # killactive
unbind = Super, Return     # terminal
unbind = Super, grave      # terminal
unbind = Super, B          # browser
unbind = Super, L          # lock
unbind = Super, Equal      # zoom in
unbind = Super, Minus      # zoom out

# ============================================================
# LAYER 1: Hyper key binds (Ctrl+Alt+Super via kanata F16 remap)
# These fire when holding the Dygma hyper key + pressing a key
# ============================================================

#! Window Management (Hyper layer)

## Movement (ESDF)
bind = Control+Alt+Super, E, movefocus, u              # Focus up
bind = Control+Alt+Super, S, movefocus, l              # Focus left
bind = Control+Alt+Super, D, movefocus, d              # Focus down
bind = Control+Alt+Super, F, movefocus, r              # Focus right
bind = Control+Alt+Super+Shift, E, movewindow, u       # Move window up
bind = Control+Alt+Super+Shift, S, movewindow, l       # Move window left
bind = Control+Alt+Super+Shift, D, movewindow, d       # Move window down
bind = Control+Alt+Super+Shift, F, movewindow, r       # Move window right

## Monitors (QWR)
bind = Control+Alt+Super, Q, focusmonitor, 0            # Focus monitor 1 (left, vertical)
bind = Control+Alt+Super, W, focusmonitor, 1            # Focus monitor 2 (main)
bind = Control+Alt+Super, R, focusmonitor, 2            # Focus monitor 3 (dashboard)
bind = Control+Alt+Super+Shift, Q, movewindow, mon:0    # Send to monitor 1
bind = Control+Alt+Super+Shift, W, movewindow, mon:1    # Send to monitor 2
bind = Control+Alt+Super+Shift, R, movewindow, mon:2    # Send to monitor 3

## Workspaces (1-6)
bind = Control+Alt+Super, code:10, workspace, 1         # Workspace 1
bind = Control+Alt+Super, code:11, workspace, 2         # Workspace 2
bind = Control+Alt+Super, code:12, workspace, 3         # Workspace 3
bind = Control+Alt+Super, code:13, workspace, 4         # Workspace 4
bind = Control+Alt+Super, code:14, workspace, 5         # Workspace 5
bind = Control+Alt+Super, code:15, workspace, 6         # Workspace 6
bind = Control+Alt+Super+Shift, code:10, movetoworkspacesilent, 1  # Send to WS 1
bind = Control+Alt+Super+Shift, code:11, movetoworkspacesilent, 2  # Send to WS 2
bind = Control+Alt+Super+Shift, code:12, movetoworkspacesilent, 3  # Send to WS 3
bind = Control+Alt+Super+Shift, code:13, movetoworkspacesilent, 4  # Send to WS 4
bind = Control+Alt+Super+Shift, code:14, movetoworkspacesilent, 5  # Send to WS 5
bind = Control+Alt+Super+Shift, code:15, movetoworkspacesilent, 6  # Send to WS 6

## Window state
bind = Control+Alt+Super, T, fullscreen, 0              # Fullscreen
bind = Control+Alt+Super, V, fullscreen, 1              # Maximize (keep borders)
bind = Control+Alt+Super, C, layoutmsg, swapnext        # Swap with next window
bind = Control+Alt+Super, A, layoutmsg, cyclenext        # Cycle layout
bind = Control+Alt+Super, Tab, global, quickshell:overviewWorkspacesToggle          # Overview/expose

## Resize (LS2/LS3 send Ctrl+= and Ctrl+- from Dygma meta layer)
## These are already handled by the existing meta layer binds
## If LS2/LS3 need dedicated hyper binds, add them here:
binde = Control+Alt+Super, Semicolon, layoutmsg, splitratio -0.1  # Shrink
binde = Control+Alt+Super, Apostrophe, layoutmsg, splitratio +0.1 # Grow

## Utilities
bind = Control+Alt+Super, X, exec, grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy  # OCR
bind = Control+Alt+Super+Shift, X, exec, grim -g "$(slurp)" /tmp/lens.png && xdg-open "https://lens.google.com/uploadbyurl?url=file:///tmp/lens.png"  # Google Lens
bind = Control+Alt+Super, Z, exec, hyprpicker -a         # Color picker
bind = Control+Alt+Super, M, exec, wpctl set-mute @DEFAULT_SINK@ toggle     # Output mute
bind = Control+Alt+Super+Shift, M, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle  # Mic mute
bind = Control+Alt+Super, grave, global, quickshell:sidebarLeftToggle   # Left sidebar
bind = Control+Alt+Super, G, global, quickshell:sidebarRightToggle     # Right sidebar

# ============================================================
# LAYER 2: Super+key global commands
# ============================================================

#! Global Commands (Super layer)

## App launchers
# Super tap = launcher (end-4 default, keep as-is)
bind = Super, grave, exec, $TERMINAL || ghostty || kitty -1 || foot  # Terminal (quake console)
bind = Super, B, exec, vivaldi-stable || zen-browser || firefox      # Browser
bind = Super, C, exec, code || codium || cursor || zed               # Code editor
bind = Super, D, exec, vesktop || discord                            # Discord
bind = Super, E, exec, dolphin || nautilus || thunar                  # File manager
bind = Super, K, exec, morgen || gnome-calendar || korganizer        # Calendar
bind = Super, Return, exec, $TERMINAL || ghostty || kitty -1 || foot # Terminal (backup)

## Window actions
bind = Super, Q, killactive,                            # Close window
bind = Super+Shift, Q, exec, hyprctl kill               # Force kill
bind = Super, T, togglefloating,                        # Toggle float/tile
bind = Super, S, togglespecialworkspace,                 # Scratchpad toggle
bind = Super+Shift, S, movetoworkspacesilent, special   # Send to scratchpad
bind = Super, Tab, global, quickshell:overviewWorkspacesToggle                     # Overview/expose

## Mouse binds
bindm = Super, mouse:272, movewindow                    # Super+LMB drag = move
bindm = Super, mouse:273, resizewindow                  # Super+RMB drag = resize
bind = Super, mouse_up, workspace, +1                   # Super+scroll = cycle workspaces
bind = Super, mouse_down, workspace, -1

## Workspace switching (mirrors hyper layer, use whichever hand is free)
bind = Super, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 1
bind = Super, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 2
bind = Super, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 3
bind = Super, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 4
bind = Super, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 5
bind = Super, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 6
bind = Super+Shift, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1
bind = Super+Shift, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2
bind = Super+Shift, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3
bind = Super+Shift, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4
bind = Super+Shift, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5
bind = Super+Shift, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6

## System toggles
bind = Super, J, global, quickshell:barToggle            # Toggle bar
bind = Super, L, exec, loginctl lock-session             # Lock session
bind = Super+Shift, L, exec, systemctl suspend           # Suspend
bind = Super, Slash, global, quickshell:cheatsheetToggle  # Cheatsheet
bind = Super, V, global, quickshell:overviewClipboardToggle  # Clipboard history
bind = Super, Period, global, quickshell:overviewEmojiToggle # Emoji picker
bind = Super, Equal, exec, ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.3  # Zoom in
bind = Super, Minus, exec, ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.3  # Zoom out
bindd = Ctrl+Alt, Delete, Toggle session menu, global, quickshell:sessionToggle  # Session menu

## Kept from end-4
bind = Super, A, global, quickshell:sidebarLeftToggle    # Left sidebar (also on hyper+`)
bind = Super, N, global, quickshell:sidebarRightToggle   # Right sidebar
bind = Super, G, global, quickshell:overlayToggle        # Overlay
bind = Ctrl+Super, R, exec, killall qs quickshell; qs -c $qsConfig &  # Restart widgets

# ============================================================
# CAPTURE (PrintScreen key, handled by Dygma meta layer)
# ============================================================

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy    # Screenshot region
bind = Shift, Print, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh  # Record region

# ============================================================
# KEPT FROM END-4 (not overridden)
# ============================================================

# Media keys (hardware via Dygma meta layer, these are just Super fallbacks)
bindl = Super+Shift, N, exec, playerctl next             # Next track
bindl = Super+Shift, B, exec, playerctl previous         # Previous track
bindl = Super+Shift, P, exec, playerctl play-pause       # Play/pause

# Brightness (hardware keys pass through)
bindle=, XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindle=, XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Volume (hardware keys pass through)
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPrev, exec, playerctl previous
