# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Ghostty: enable blur behind transparent background
# (overrides NaviDE's global no_blur rule)
windowrule = match:class ^(com\.mitchellh\.ghostty)$, no_blur off

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1

# ######## Workspace rules ########

# Master layout orientation per monitor (only active when master layout is enabled)
# A — DP-1, center column layout (workspaces 1-4)
workspace = 1, layoutopt:orientation:center
workspace = 2, layoutopt:orientation:center
workspace = 3, layoutopt:orientation:center
workspace = 4, layoutopt:orientation:center
# B — HDMI-A-2, vertical monitor: top/bottom stacking (workspaces 5-7)
workspace = 5, layoutopt:orientation:top
workspace = 6, layoutopt:orientation:top
workspace = 7, layoutopt:orientation:top
# C — DP-2, center column layout (workspaces 8-10)
workspace = 8, layoutopt:orientation:center
workspace = 9, layoutopt:orientation:center
workspace = 10, layoutopt:orientation:center


