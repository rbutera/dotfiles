# NaviDE monitor layout
#
# Physical arrangement:
#      C (DP-2, Samsung 4K, flipped 180°)
#   B  A (DP-1, LG Ultragear 4K 240Hz)
#   (HDMI-A-2, LG SDQHD 2560x2880)
#
# B's top aligns ~30% down from A's top.
# All monitors at scale 1 (no UI scaling).

# A — main monitor, anchor at (2560, 0)
monitor=DP-1,3840x2160@240,2560x0,1

# B — left, offset down (30% of A's 2160 = 648px)
monitor=HDMI-A-2,2560x2880@60,0x648,1

# C — above A, flipped upside down (transform 2 = 180°)
monitor=DP-2,3840x2160@60,2560x-2160,1,transform,2
