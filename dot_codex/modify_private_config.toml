#!/usr/bin/env python3
"""Modify script for ~/.codex/config.toml

Merges managed base config into existing Codex settings.
Managed: top-level settings, permissions, mcp_servers, model_providers, plugins, marketplaces
Free: projects, notice (machine-specific, added by Codex at runtime)
"""

import os
import sys

try:
    import tomllib
except ModuleNotFoundError:
    try:
        import tomli as tomllib
    except ModuleNotFoundError:
        print("ERROR: need tomllib (Python 3.11+) or tomli backport (`pip3 install tomli`)", file=sys.stderr)
        sys.exit(1)

try:
    import tomli_w
except ModuleNotFoundError:
    print("ERROR: need tomli_w (`pip3 install tomli-w`)", file=sys.stderr)
    sys.exit(1)

# ── Base config: fields we want on all machines ──────────────────────────────
BASE = {
    "personality": "pragmatic",
    "model": "gpt-5.6-sol",
    "model_reasoning_effort": "high",
    "model_reasoning_summary": "auto",
    "approval_policy": "never",
    "default_permissions": ":danger-full-access",
    "features": {
        "multi_agent": True,
    },
    "mcp_servers": {
        "github": {
            "url": "https://api.githubcopilot.com/mcp/",
            "bearer_token_env_var": "GITHUB_LLM_PAT",
        },
        "context7": {
            "command": "npx",
            "args": ["-y", "@upstash/context7-mcp@latest"],
        },
        "mcp-deepwiki": {
            "command": "npx",
            "args": ["-y", "mcp-deepwiki@latest"],
        },
        "Playwright": {
            "command": "npx",
            "args": ["-y", "@playwright/mcp@latest"],
        },
        "serena": {
            "command": "uvx",
            "args": [
                "--from",
                "git+https://github.com/oraios/serena",
                "serena",
                "start-mcp-server",
                "--context",
                "codex",
            ],
        },
        "tempograph": {
            "command": "uvx",
            "args": ["--from", "tempograph[full]", "tempograph-server"],
        },
        "oss-autopilot": {
            "command": "npx",
            "args": ["-y", "@oss-autopilot/mcp@latest"],
        },
        "exa": {
            "url": "https://mcp.exa.ai/mcp?enableAdvancedSearch=true",
            "headers": {"x-api-key": os.environ.get("EXA_API_KEY", "")},
        },
        # Reverse leg (Codex -> Claude). Runs the local harness-bridge build, the
        # same codebase as the forward leg, rather than the stale upstream npm
        # package it used to point at. harness-bridge is not published to npm.
        "claude": {
            "command": "node",
            "args": [os.path.expanduser("~/dev/harness-bridge/dist/cli.mjs"), "serve", "claude"],
        },
        # Android device control (mobile-next/mobile-mcp) — a11y-tree-first hybrid,
        # full app lifecycle. Needs adb (Android platform-tools) + a device/emulator.
        "mobile-mcp": {
            "command": "npx",
            "args": ["-y", "@mobilenext/mobile-mcp@latest"],
            "env": {"MOBILEMCP_DISABLE_TELEMETRY": "1"},
        },
        # Computer-use (trycua/cua) — background, accessibility-grounded. macOS needs
        # `cua-driver permissions grant` (Accessibility + Screen Recording) once.
        "cua-driver": {
            "command": "/Users/rai/.local/bin/cua-driver",
            "args": ["mcp"],
        },
    },
    "model_providers": {
        "zen": {
            "name": "OpenCode Zen",
            "base_url": "https://opencode.ai/zen/v1",
            "env_key": "OPENCODE_ZEN_API_KEY",
            "wire_api": "responses",
        },
    },
    "plugins": {
        "google-calendar@openai-curated": {"enabled": True},
        "gmail@openai-curated": {"enabled": True},
        "github@openai-curated": {"enabled": True},
        "google-drive@openai-curated": {"enabled": True},
        "slack@openai-curated": {"enabled": True},
        "caveman@caveman-repo": {"enabled": True},
    },
    "marketplaces": {
        "caveman-repo": {
            "source_type": "git",
            "source": "https://github.com/JuliusBrussee/caveman.git",
        },
    },
}


# ── Arch-only MCP servers ────────────────────────────────────────────────────
_is_arch = False
try:
    with open("/etc/os-release") as f:
        for line in f:
            if line.startswith(("ID=arch", "ID_LIKE=arch")):
                _is_arch = True
                break
except FileNotFoundError:
    pass

if _is_arch:
    BASE["mcp_servers"]["arch-linux"] = {
        "command": "uvx",
        "args": ["arch-ops-server"],
    }

# ── Florence (kinto)-only MCP servers ────────────────────────────────────────
# The codex "doppelganger" runs in ~/focused on kinto. These servers are only
# wired into Florence's Claude/Ark harness (ark plugin .mcp.json + focused
# .mcp.json), so codex couldn't see them. Port them here, host-gated to kinto so
# Navi (nimbus) doesn't inherit Florence's work vault / kinto-local services.
# Deliberately NOT ported: discord / discord-voice / elevenlabs (voice+chat
# transport, harness-bound) and playwright-headed (codex already has Playwright).
import socket as _socket

_host = _socket.gethostname().split(".")[0].lower()
if _host.startswith("kinto"):
    BASE["mcp_servers"].update({
        # quick-markdown search. qmd's native MCP is STDIO (`qmd mcp`), so codex
        # spawns it directly — more robust than the ark plugin's http://[::1]:8181
        # wrapper, which needs a separate server that isn't always running.
        "qmd": {
            "command": "qmd",
            "args": ["mcp"],
        },
        # focused vault CRUD (focused .mcp.json).
        "obsidian": {
            "command": "mcpvault",
            "args": [os.path.join(os.path.expanduser("~"), "focused", "vault")],
        },
        # JIRA + Confluence (focused .mcp.json).
        "atlassian": {
            "command": "uvx",
            "args": ["mcp-atlassian"],
        },
        # Notion conventions hub (focused .mcp.json). Hosted; first use prompts
        # a one-time OAuth in the browser.
        "notion": {
            "url": "https://mcp.notion.com/mcp",
        },
        # SonarCloud PR quality (focused .mcp.json). Needs docker + the
        # SONARQUBE_* env (SONARQUBE_TOKEN/ORG/URL) in the codex environment.
        "sonarqube": {
            "command": "docker",
            "args": [
                "run", "-i", "--rm",
                "-e", "SONARQUBE_TOKEN",
                "-e", "SONARQUBE_ORG",
                "-e", "SONARQUBE_URL",
                "mcp/sonarqube",
            ],
        },
    })

# tempograph (Rust build fails), oss-autopilot don't work on Windows — remove them.
if sys.platform == "win32":
    for _srv in ("tempograph", "oss-autopilot"):
        BASE["mcp_servers"].pop(_srv, None)


def deep_merge(base: dict, override: dict) -> dict:
    """Merge two dicts. base wins for shared keys, override adds new keys."""
    result = dict(base)
    for key, value in override.items():
        if key in result and isinstance(result[key], dict) and isinstance(value, dict):
            result[key] = deep_merge(result[key], value)
        elif key not in result:
            result[key] = value
    return result


# Read current config from stdin
raw = sys.stdin.buffer.read()
if raw.strip():
    current = tomllib.loads(raw.decode())
else:
    current = {}

# Merge: base wins for managed keys, current adds free keys (projects, notice, etc.)
merged = deep_merge(BASE, current)

# Permission profiles replace the legacy sandbox settings and must not coexist
# with them, including stale values preserved from the deployed config.
for key in ("sandbox", "sandbox_mode", "sandbox_workspace_write"):
    merged.pop(key, None)

# Authoritative keys: base is the sole source of truth for these.
# Removals from base are reflected in deployed config.
for key in ("mcp_servers", "model_providers", "plugins"):
    if key in BASE:
        merged[key] = BASE[key]

# The desktop app owns these generated integrations. Preserve the machine-local
# paths, versioned plugin state, and runtime hashes it writes into the config.
for name in ("node_repl", "computer-use"):
    if name in current.get("mcp_servers", {}):
        merged["mcp_servers"][name] = current["mcp_servers"][name]

for name, config in current.get("plugins", {}).items():
    if name.endswith(("@openai-bundled", "@openai-primary-runtime")):
        merged["plugins"][name] = config

sys.stdout.buffer.write(tomli_w.dumps(merged).encode())
