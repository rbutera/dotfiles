personality = "pragmatic"
model = "gpt-5.3-codex"
model_reasoning_effort = "high"
model_reasoning_summary = "auto"
approval_policy = "never"

[sandbox]
writable_roots = ["/home/rai", "/tmp"]
network_access = true
[projects."/home/rai/oc-pr"]
trust_level = "trusted"

[projects."/home/rai/oclaw"]
trust_level = "trusted"

[projects."/home/rai/dev/clarkecarpentry"]
trust_level = "trusted"

[projects."/home/rai/.local/share/chezmoi"]
trust_level = "trusted"

[projects."/home/rai/.config/nvim"]
trust_level = "trusted"

[projects."/home/rai"]
trust_level = "trusted"

[projects."/home/rai/.config/opencode"]
trust_level = "trusted"

[projects."/home/rai/dev/lumiere"]
trust_level = "trusted"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_LLM_PAT"

[mcp_servers.Sanity]
url = "https://mcp.sanity.io"
bearer_token_env_var = "SANITY_MCP_TOKEN"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.open-websearch]
url = "http://localhost:3005/mcp"

[mcp_servers.mcp-deepwiki]
command = "npx"
args = ["-y", "mcp-deepwiki@latest"]

[mcp_servers.Playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.serena]
command = "uvx"
args = [
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--context",
  "ide-assistant",
  "--enable-web-dashboard",
  "false",
]

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[model_providers.zen]
name = "OpenCode Zen"
base_url = "https://opencode.ai/zen/v1"
env_key = "OPENCODE_ZEN_API_KEY"
wire_api = "responses"
